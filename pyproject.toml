[project]
name = "pre-commit-hooks"
version = "1.0.0"
description = "Pre-commit hooks that help me"
authors = [
    { name = "Kurt McKee", email = "contactme@kurtmckee.org" },
]
license = "MIT"
readme = "README.rst"
requires-python = ">=3.10"
classifiers = [
    "Private :: Do Not Upload",
]
dependencies = [
    "tomli ; python_version < '3.11'",
]

[project.scripts]
verify-consistent-pyproject-toml-python-requirements = "hooks.verify_consistent_pyproject_toml_python_requirements:main"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"


# chipshot
# --------

[tool.chipshot]
template = """
This file is a part of Kurt McKee's pre-commit-hooks project.
https://github.com/kurtmckee/pre-commit-hooks
Copyright 2024-2026 Kurt McKee <contactme@kurtmckee.org>
SPDX-License-Identifier: MIT
"""


# poetry
# ------

[tool.poetry]
packages = [{include = "hooks", from = "src"}]


# flake8
# ------

[tool.flake8]
max-line-length = 80
extend-select = ["B950"]
extend-ignore = ["E203", "E501", "E701"]
